## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  lvgl/lvgl: ^9.6.0
  espressif/esp_lvgl_adapter: ^0.7.5

  esp_lcd_touch_gt911: "^1"

  # ESP32-P4 board (Waveshare ESP32-P4-WIFI6-Touch-LCD-7B)
  # MIPI DSI panel driver
  espressif/esp_lcd_ek79007:
    version: "1.*"
    rules:
      - if: "target == esp32p4"
  # The P4 has no Wi-Fi: the ESP32-C6 on the board provides it over SDIO, and
  # esp_wifi_remote forwards the esp_wifi API to it through esp_hosted. Versions
  # follow Waveshare's 05_wifistation example, which matches the firmware the C6 ships with.
  espressif/esp_wifi_remote:
    version: "==1.2.5"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "1.4.*"
    rules:
      - if: "target == esp32p4"
